<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>时璃 Timeglass</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- 自定义标题栏（拖拽区） -->
<div id="titlebar" data-solve="标题栏" data-solve-kind="input">
  <span class="brand">时璃<span class="en">Timeglass</span></span>
  <span class="spacer"></span>
  <div class="winbtns">
    <button class="winbtn" id="btn-min" title="最小化">—</button>
    <button class="winbtn" id="btn-max" title="最大化">□</button>
    <button class="winbtn" id="btn-close" title="关闭到托盘">✕</button>
  </div>
</div>

<div class="shell">
  <!-- 侧栏 -->
  <nav class="rail" id="rail">
    <button class="rbtn on" data-view="timeline" title="时间轴">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="9"/></svg>
      <span class="tip">时间轴</span>
    </button>
    <button class="rbtn" data-view="archive" title="归档图库">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v10.5a.5.5 0 0 0 .5.5h13a.5.5 0 0 0 .5-.5V9"/><path d="M10 13h4"/></svg>
      <span class="tip">归档图库</span>
    </button>
    <button class="rbtn" data-view="transcode" title="转码工坊">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 4v4h-4"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 20v-4h4"/></svg>
      <span class="tip">转码工坊</span>
    </button>
    <button class="rbtn" data-view="settings" title="偏好设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.06-.4.1-.8.1-1.2Z"/></svg>
      <span class="tip">偏好设置</span>
    </button>
    <button class="rbtn" data-view="appearance" title="外观与皮肤">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9c0-.5 0-.95-.13-1.4A5.5 5.5 0 0 1 12 3Z"/><circle cx="12" cy="12" r="4"/></svg>
      <span class="tip">外观与皮肤</span>
    </button>
    <span class="gap"></span>
    <span class="paused-dot" id="paused-dot" title="采集已暂停"></span>
  </nav>

  <!-- 主区 -->
  <main class="main">
    <header class="tabbar">
      <span class="crumb" id="crumb">时间轴</span>
      <span class="sub" id="crumb-sub"></span>
      <span class="spacer"></span>
      <span class="statuschip" id="statuschip"><span class="dot"></span><span id="status-text">采集运行中</span></span>
    </header>
    <div class="content" id="content">
      <section class="view on" id="view-timeline"></section>
      <section class="view" id="view-archive"></section>
      <section class="view" id="view-transcode"></section>
      <section class="view" id="view-settings"></section>
      <section class="view" id="view-appearance"></section>
    </div>
  </main>
</div>

<!-- 归档详情右滑面板 -->
<aside class="detail" id="detail" data-solve="详情面板"></aside>

<div class="toast" id="toast"></div>

<script src="mcu.iife.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
